# infrarsi-exp/1 mechanism registry (initial entries). A mechanism is one idea that may exist in several codebases.
# class: kernel  - the sign transfers across GPU classes (sizes within about 2x)
#        balance - compute vs bandwidth vs memory trade-offs: a numeric prior needs the same GPU class, nodes and layout
# states: the canonical values (strings; quote on / off / yes / no, YAML reads them as booleans); default: the state when a config does not mention the mechanism.
# aliases (per framework): how a knob maps to a state.
#   flag + present: the flag appearing means `present`, absent means default   flag + value: the flag's value is the state
#   env + map: env var value -> state                                          config: a config-file path whose value is the state
# requires: {state: {other mechanism: state}} - that state only exists with the other one (a change that sets both is
#   one change of this mechanism).
# depends_on: [mechanisms] - the move's size depends on these states (tf32 on precision): an effect measured with another
#   state of them than the target's reference is context (partial), not a covered prior.
# Add an entry (or an alias) by pull request; until then packs may use ids prefixed x-.

tp:                {class: balance, states: int, default: "1", aliases: {megatron: [{flag: --tensor-model-parallel-size, value: state}], torchtitan: [{flag: --parallelism.tensor-parallel-degree, value: state}]}}
pp:                {class: balance, states: int, default: "1", aliases: {megatron: [{flag: --pipeline-model-parallel-size, value: state}], torchtitan: [{flag: --parallelism.pipeline-parallel-degree, value: state}]}}
cp:                {class: balance, states: int, default: "1", aliases: {megatron: [{flag: --context-parallel-size, value: state}]}}
ep:                {class: balance, states: int, default: "1", aliases: {megatron: [{flag: --expert-model-parallel-size, value: state}]}}
micro_batch: {class: balance, states: int, aliases: {megatron: [{flag: "--micro-batch-size", value: state}], hf_trainer: [{config: per_device_train_batch_size}], accelerate: [{flag: "--train_batch_size", value: state}]}, notes: "the global batch stays fixed; gradient accumulation absorbs the change; measured (diffusion harvest): H100 sdxl-unet 4->2 x0.72 (SX00~SX20); H200 DiT-XL/2 32->16 x0.84 (HDX05~HDX40); H100 2n ib DiT-XL/2 32->16 x0.86 (M2DX05~M2DX40); H100 DiT-XL/2 32->16 x0.86 (DX05~DX40); H100 flux1-dev 4->1 x0.88 (FL03~FL20); H100 sd15-unet 16->8 x0.88 (SA00~SA20); +6 more"}
precision: {class: balance, states: [bf16, fp16, fp8_delayed, fp8_tensorwise, fp8_blockwise, float8, fp32], default: bf16, aliases: {megatron: [{flag: "--fp8-recipe", map: {delayed: fp8_delayed, tensorwise: fp8_tensorwise, blockwise: fp8_blockwise}}], accelerate: [{flag: "--mixed_precision", map: {"no": fp32, fp16: fp16, bf16: bf16}}, {flag: "--do_fp8_training", present: float8}]}, notes: "FP8 validity depends on the workload: on mock data the loss can leave a 3 % tolerance; fp32 = no autocast (TF32 only with tf32 on); float8 also = diffusers --do_fp8_training (torchao float8 training); measured (diffusion harvest): H200 sd15-unet bf16->fp32 x0.37 (HSA00~HSA02); H20 sd15-unet bf16->fp32 x0.39 (GSA00~GSA02); H100 sd15-unet bf16->fp32 x0.39 (SA00~SA02); H100 sd15-unet fp16->fp32 x0.39 (SA01~SA02); H100 DiT-XL/2 bf16->float8 x0.43 (DX05~DX50); H100 z-image-turbo bf16->float8 x0.44 (ZL03~ZL04); +26 more"}
bf16_main_grads:   {class: kernel, states: [fp32, bf16], default: fp32, aliases: {megatron: [{flag: --main-grads-dtype, value: state}]},
                    requires: {bf16: {precision_aware_optimizer: "on"}},
                    notes: "Megatron-Core 0.13 accepts bf16 only with --use-precision-aware-optimizer"}
precision_aware_optimizer: {class: kernel, states: ["off", "on"], default: "off", aliases: {megatron: [{flag: --use-precision-aware-optimizer, present: "on"}]}}
recompute: {class: kernel, states: [none, selective, full], default: none, aliases: {megatron: [{flag: "--recompute-activations", present: selective}, {flag: "--recompute-granularity", value: state}], fsdp: [{config: ac, map: {"0": none, "1": full}}], accelerate: [{flag: "--gradient_checkpointing", present: full}, {flag: "--use_gradient_checkpointing", present: full}]}, notes: "measured (diffusion harvest): H100 flux1-dev full->none x1.40 (FL32~FL40); H100 flux1-dev full->none x1.39 (FL06~FL13); H20 qwen-image full->none x1.39 (GQL00~GQL04); H20 z-image-turbo full->none x1.39 (GZL00~GZL03); H100 qwen-image full->none x1.38 (QL01~QL30); H20 flux1-dev full->none x1.38 (GFL00~GFL01); +27 more"}
attention_backend: {class: kernel, states: [auto, cudnn, flash, unfused, xformers, efficient, flash4, cudnn_prio], default: auto, aliases: {megatron: [{flag: "--attention-backend", map: {auto: auto, fused: cudnn, flash: flash, unfused: unfused}}], hf_trainer: [{config: attn_implementation, map: {sdpa: auto, flash_attention_2: flash, eager: unfused}}], accelerate: [{env: DIFFUSERS_ATTN_BACKEND, map: {native: auto, flash: flash, _native_cudnn: cudnn, _native_efficient: efficient, xformers: xformers}}, {env: DIFFSYNTH_ATTENTION_IMPLEMENTATION, map: {torch: auto, flash_attention_2: flash, flash_attention_4: flash4, xformers: xformers}}, {flag: "--enable_xformers_memory_efficient_attention", present: xformers}]}, notes: "cudnn = cuDNN forced for the model's attention (diffusers _native_cudnn); cudnn_prio = cuDNN first in torch's SDPA priority with per-call fall-back (sdpa_kernel(order, set_priority=True)); efficient = SDPA memory-efficient kernel (replaces the H20 packs' x-efficient); flash = FlashAttention-2 (torch SDPA or flash-attn); flash4 = flash-attn-4; xformers = xformers memory-efficient attention; measured (diffusion harvest): H100 qwen-image flash->cudnn_prio x0.40 (DQ00~DQ01); H100 qwen-image auto->cudnn x0.40 (QL00~QL06); H100 flux1-dev xformers->efficient x0.68 (FL32~FL33); H100 wan2.1-t2v-14b flash->cudnn_prio x1.40 (WL00~WL02); H100 wan2.1-t2v-1.3b auto->cudnn_prio x1.39 (WN22~WN23); H100 flux1-dev cudnn_prio->efficient x0.74 (DF01~DF02); +52 more; 4 within noise"}
fused_cross_entropy: {class: kernel, states: ["off", "on"], default: "off", aliases: {megatron: [{flag: --cross-entropy-loss-fusion, present: "on"}]}}
cross_entropy_fusion_impl: {class: kernel, states: [native, te], default: native, aliases: {megatron: [{flag: --cross-entropy-fusion-impl, value: state}]}}
nan_check:         {class: kernel, states: ["on", "off"], default: "on", aliases: {megatron: [{flag: --no-check-for-nan-in-loss-and-grad, present: "off"}]}}
manual_gc:         {class: kernel, states: ["off", "on"], default: "off", aliases: {megatron: [{flag: --manual-gc, present: "on"}]}}
compile: {class: kernel, states: ["off", "on"], default: "off", aliases: {torchtitan: [{flag: "--compile.enable", present: "on"}], fsdp: [{config: compile, map: {"true": "on", "false": "off"}}], accelerate: [{config: "dynamo_config.dynamo_backend", map: {INDUCTOR: "on", "NO": "off"}}]}, notes: "measured (diffusion harvest): H100 DiT-XL/2 off->on x2.72 (DX50~DX51); H20 DiT-XL/2 off->on x2.09 (GDX50~GDX51); H100 flux1-dev off->on x1.59 (FL32~FL43); H100 flux1-dev off->on x1.45 (FL06~FL34); H100 flux1-dev off->on x1.44 (FL40~FL41); H100 flux1-dev off->on x1.38 (FL13~FL42); +11 more"}
nvls:              {class: kernel, states: ["on", "off"], default: "on", aliases: {any: [{env: NCCL_NVLS_ENABLE, map: {"0": "off", "1": "on", "2": "on"}}]},
                    notes: "2 = NCCL's automatic mode, its default: on where NVLS works (the NVSwitch nodes the packs measured); no throughput change measured on H20 / H200 single nodes; off saves about 4 GiB"}
expandable_segments: {class: kernel, states: ["off", "on"], default: "off", aliases: {any: [{env: PYTORCH_CUDA_ALLOC_CONF, map: {"expandable_segments:True": "on", "": "off"}}]}}
empty_unused_memory: {class: kernel, states: ["0", "1", "2"], default: "0", aliases: {megatron: [{flag: --empty-unused-memory-level, value: state}]}}
distributed_optimizer: {class: kernel, states: ["off", "on"], default: "off", aliases: {megatron: [{flag: --use-distributed-optimizer, present: "on"}]}}
dp_grad_overlap:   {class: balance, states: ["off", "on"], default: "off", aliases: {megatron: [{flag: --overlap-grad-reduce, present: "on"}]}}
dp_param_gather_overlap: {class: balance, states: ["off", "on"], default: "off", aliases: {megatron: [{flag: --overlap-param-gather, present: "on"}]},
                    requires: {"on": {dp_grad_overlap: "on"}},
                    notes: "Megatron needs --overlap-grad-reduce and the distributed optimizer"}
tp_comm_overlap:   {class: balance, states: ["off", "on"], default: "off", aliases: {megatron: [{flag: --tp-comm-overlap, present: "on"}]},
                    requires: {"on": {sequence_parallel: "on"}}, notes: "Megatron-Core userbuffer overlap needs sequence parallelism"}
sequence_parallel: {class: balance, states: ["off", "on"], default: "off", aliases: {megatron: [{flag: --sequence-parallel, present: "on"}]}}
cuda_max_connections: {class: balance, states: int, default: "1", aliases: {any: [{env: CUDA_DEVICE_MAX_CONNECTIONS, value: state}]}}
avoid_record_streams: {class: balance, states: ["0", "1"], default: "0", aliases: {any: [{env: TORCH_NCCL_AVOID_RECORD_STREAMS, value: state}]}}
ddp_average_in_collective: {class: balance, states: ["off", "on"], default: "off", aliases: {megatron: [{flag: --ddp-average-in-collective, present: "on"}]}}
data_workers: {class: balance, states: int, aliases: {megatron: [{flag: "--num-workers", value: state}], hf_trainer: [{config: dataloader_num_workers}], accelerate: [{flag: "--dataloader_num_workers", value: state}, {flag: "--dataset_num_workers", value: state}], pytorch: [{flag: "--num-workers", value: state}]}, notes: "measured (diffusion harvest): H100 sd15-unet 0->8 x1.86 (SA10~SA11); H100 sd15-unet 4->0 x0.54 (SA00~SA10); H100 wan2.1-t2v-1.3b 0->4 x1.07 (WN00~WN03); H100 DiT-S/2 4->16 x1.04 (DS01~DS21); H100 DiT-XL/2 2->16 x1.03 (DX21~DX23); H100 DiT-XL/2 8->16 x1.02 (DX22~DX23); +5 more; 5 within noise"}
zero_stage: {class: balance, states: ["0", "1", "2", "3"], aliases: {deepspeed: [{config: "zero_optimization.stage"}], accelerate: [{config: "deepspeed_config.zero_stage", value: state}]}, notes: "measured (diffusion harvest): H200 flux1-dev 3->2 x1.58 (HFF00~HFF01); H100 flux1-dev 2->3 x0.75 (FF01~FF00); H100 4n ib flux1-dev 3->2 x1.30 (M4FF00~M4FF01); H100 2n ib flux1-dev 3->2 x1.28 (M2FF00~M2FF01); H100 flux1-dev 3->2 x1.23 (DF11~DF12); H20 flux1-dev 3->2 x1.11 (GFF00~GFF01)"}
cpu_offload: {class: balance, states: [none, optimizer, params, all], default: none, aliases: {megatron: [{flag: "--optimizer-cpu-offload", present: optimizer}], deepspeed: [{config: "zero_optimization.offload_optimizer.device", map: {cpu: optimizer, none: none}}], accelerate: [{config: "deepspeed_config.offload_optimizer_device", map: {cpu: optimizer, none: none}}]}, notes: "measured (diffusion harvest): H100 flux1-dev none->optimizer x0.19 (FF01~FF02); H100 flux1-dev optimizer->none x4.69 (DF10~DF12)"}
moe_grouped_gemm:  {class: kernel, states: ["off", "on"], default: "off", aliases: {megatron: [{flag: --moe-grouped-gemm, present: "on"}]}}
moe_permute_fusion: {class: kernel, states: ["off", "on"], default: "off", aliases: {megatron: [{flag: --moe-permute-fusion, present: "on"}]}}
moe_dispatcher:    {class: kernel, states: [alltoall, allgather, flex], aliases: {megatron: [{flag: --moe-token-dispatcher-type, value: state}]}}
gradient_accumulation_fusion: {class: kernel, states: ["on", "off"], default: "on", aliases: {megatron: [{flag: --no-gradient-accumulation-fusion, present: "off"}]},
