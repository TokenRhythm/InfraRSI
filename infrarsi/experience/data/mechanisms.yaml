grad_as_bucket_view: {class: kernel, states: ["off", "on"], default: "off", notes: "DistributedDataParallel(gradient_as_bucket_view=True): gradients are views of the all-reduce buckets (one copy and its memory less); measured (diffusion harvest): H100 DiT-XL/2 off->on x1.03 (DX05~DX16)"}
ddp_bucket_mb: {class: balance, states: int, default: "25", notes: "DistributedDataParallel(bucket_cap_mb=...); measured (diffusion harvest): 1 within noise"}
cudnn_benchmark: {class: kernel, states: ["off", "on"], default: "off", notes: "torch.backends.cudnn.benchmark (convolution autotuning; UNet / VAE convolutions); measured (diffusion harvest): 1 within noise"}
master_weights: {class: kernel, states: [fp32, bf16], default: fp32, notes: "dtype of the weights the optimizer updates: fp32 masters with bf16 compute (AMP, DeepSpeed bf16) or pure bf16 weights (DiffSynth-Studio without DeepSpeed); changes numerics and memory"}
recompute_offload: {class: balance, states: ["off", "on"], default: "off", aliases: {accelerate: [{flag: "--use_gradient_checkpointing_offload", present: "on"}]}, notes: "checkpointed activations kept in CPU memory (DiffSynth --use_gradient_checkpointing_offload); measured (diffusion harvest): H100 wan2.1-t2v-1.3b off->on x0.57 (WN00~WN04); H100 wan2.1-t2v-14b off->on x0.71 (WL00~WL01)"}
model_offload: {class: balance, states: ["off", "on"], default: "off", aliases: {accelerate: [{flag: "--offload", present: "on"}]}, notes: "frozen helper models (VAE, text encoders) moved to the CPU between uses (diffusers dreambooth --offload); measured (diffusion harvest): 1 within noise"}
fp8_frozen_weights: {class: kernel, states: ["off", "on"], default: "off", notes: "frozen base weights stored in float8 and upcast for compute (DiffSynth --fp8_models), the FP8 analogue of qlora: changes numerics; measured (diffusion harvest): H100 qwen-image off->on x0.67 (DQ00~DQ03)"}
fsdp_sharding: {class: balance, states: [none, full_shard, shard_grad_op, hybrid_shard], default: none, aliases: {accelerate: [{config: "fsdp_config.fsdp_reshard_after_forward", map: {"true": full_shard, "false": shard_grad_op}}]}, notes: "accelerate FSDP (fsdp_version 2) sharding instead of DDP / DeepSpeed (zero_stage 0)"}
recompute_impl: {class: kernel, states: [model, fsdp], default: model, aliases: {accelerate: [{config: "fsdp_config.fsdp_activation_checkpointing", map: {"true": fsdp, "false": model}}]}, notes: "who applies activation checkpointing: the model's own gradient_checkpointing (diffusers --gradient_checkpointing) or accelerate's FSDP wrapper; with FSDP2 only the latter ran (FF03 crashed, FF08 ran)"}
