latent_cache: {class: kernel, states: ["off", "on"], default: "off", aliases: {accelerate: [{flag: "--cache_latents", present: "on"}]}, notes: "pre-computed VAE latents instead of encoding the images every step (diffusers --cache_latents; DiffSynth split training sft:data_process + sft:train also caches the text embeddings; DiT: pre-extracted latents); measured (diffusion harvest): H100 DiT-S/2 off->on x3.57 (DS01~DS05); H100 DiT-B/2 off->on x2.76 (DB01~DB05); H20 DiT-XL/2 off->on x1.73 (GD501~GD505); H100 DiT-XL/2 off->on x1.69 (D501~D505); H100 DiT-L/2 off->on x1.68 (DL01~DL05); H20 DiT-XL/2 off->on x1.68 (GDX01~GDX05); +10 more"}
text_embed_cache: {class: kernel, states: ["off", "on"], default: "off", notes: "text-encoder outputs computed once and the encoders freed, instead of encoding every step (diffusers dreambooth scripts with one instance prompt - FLUX LoRA needs a patched script in 0.41.0; the SDXL script pre-computes caption embeddings; DiffSynth split training); measured (diffusion harvest): H100 flux1-dev off->on x1.03 (FL05~FL15)"}
vae_precision: {class: kernel, states: [fp32, bf16, fp16], notes: "dtype of the frozen VAE encoder used every step; no default (diffusers SD1.5 uses the weight dtype, SDXL keeps fp32, DiT train.py fp32); measured (diffusion harvest): H20 DiT-XL/2 fp32->bf16 x1.19 (GDX01~GDX02); H100 DiT-XL/2 fp32->bf16 x1.14 (DX01~DX02)"}
ema: {class: kernel, states: ["off", loop, foreach, offload], default: "off", aliases: {accelerate: [{flag: "--use_ema", present: loop}]}, notes: "EMA of the trained weights after every update: per-parameter loop, torch._foreach_* ops (diffusers --foreach_ema), or the EMA copy on the CPU (--offload_ema); map --foreach_ema / --offload_ema with mechanism: ema; measured (diffusion harvest): H100 sd15-unet off->offload x0.54 (SA00~SA08); H100 sd15-unet offload->foreach x1.79 (SA08~SA09); H100 sd15-unet loop->offload x0.57 (SA07~SA08); H100 sdxl-unet off->loop x0.94 (SX00~SX09); H200 DiT-XL/2 loop->off x1.05 (HDX05~HDX09); H100 sd15-unet off->loop x0.96 (SA00~SA07); +7 more"}
