bf16_moments:      {class: kernel, states: ["fp32", "bf16"], default: fp32, aliases: {megatron: [{flag: --exp-avg-dtype, value: state}]},
                    requires: {bf16: {precision_aware_optimizer: "on"}}}
fp8_param_gather:  {class: balance, states: ["off", "on"], default: "off", aliases: {megatron: [{flag: --fp8-param-gather, present: "on"}]}}
virtual_pipeline:  {class: balance, states: int, default: "1", aliases: {megatron: [{flag: --num-virtual-stages-per-pipeline-rank, value: state}]}}
omp_threads: {class: balance, states: int, aliases: {any: [{env: OMP_NUM_THREADS, value: state}]}, notes: "torchrun sets 1: a CPU-offloaded optimizer then runs single-threaded; measured (diffusion harvest): H100 flux1-dev 1->16 x1.68 (FF02~FF07); H100 flux1-dev 1->16 x1.39 (DF10~DF13)"}

# Merged 2026-10-22 from the harvest session's proposals (reports/h20_prior_20261021/experience/PROPOSED_MECHANISMS.yaml):
# the x- ids of the harvest packs without the prefix; the packs keep the x- ids until their converter is re-run.
fp8_attention:         {class: kernel, states: ["off", "on"], default: "off", aliases: {megatron: [{flag: --fp8-dot-product-attention, present: "on"}]},
                        notes: "TE FP8 dot-product attention on top of FP8 GEMMs (Megatron-Core 0.13 has no CLI flag: TransformerConfig.fp8_dot_product_attention); needs cuDNN >= 9.10 with TE 2.3. H20 +6 % at 4k, +30 % at 32k; H200 -1 to -11 %"}
grad_reduce_bf16:      {class: balance, states: ["off", "on"], default: "off", aliases: {megatron: [{flag: --grad-reduce-in-bf16, present: "on"}]},
                        notes: "halves the distributed-optimizer reduce-scatter bytes; 2 nodes over TCP, DP16: x1.35 (H20), x1.88 (H200)"}
cp_comm:               {class: balance, states: [p2p, a2a, allgather, "a2a+p2p"], default: p2p, aliases: {megatron: [{flag: --cp-comm-type, value: state}]},
                        notes: "one node, TP2 x CP4 at 32k: a2a within +-1.5 % of p2p"}
etp:                   {class: balance, states: int, aliases: {megatron: [{flag: --expert-tensor-parallel-size, value: state}]},
                        notes: "Megatron default = TP; Qwen3-30B-A3B EP4 x TP2 x ETP2 0.66x (H20) / 0.48x (H200) of EP8"}
moe_layer_recompute:   {class: kernel, states: ["off", "on"], default: "off", aliases: {megatron: [{flag: --moe-layer-recompute, present: "on"}]},
                        notes: "required to fit Qwen3-30B-A3B on one 8x H20 node"}
megatron_fsdp:         {class: balance, states: [none, custom, torch_fsdp2], default: none,
                        aliases: {megatron: [{flag: --use-custom-fsdp, present: custom}, {flag: --use-torch-fsdp2, present: torch_fsdp2}]},
                        notes: "Megatron-Core 0.13: custom needs CUDA_DEVICE_MAX_CONNECTIONS > 1 and ~22.5 GiB slack (<= 8B on 96 GB); torch_fsdp2 is broken"}
cpu_opt_overlap:       {class: balance, states: ["off", "on"], default: "off", aliases: {megatron: [{flag: --overlap-cpu-optimizer-d2h-h2d, present: "on"}]}}
nccl_sockets:          {class: balance, states: ["1x1", "2x2", "4x2", "4x4"], default: "1x1",
