hsdp:                  {class: balance, states: [none, "2x4", "2x8"], default: none,
                        notes: "replicate x shard; one node 2x4 vs full shard 0.97x; 2 nodes over TCP, 2x8 vs full shard 16: x2.2; torchtitan's --parallelism.data-parallel-replicate-degree alone cannot tell 2x4 from 2x8: map such a knob with mechanism: hsdp and states"}
grad_sync_every_micro: {class: balance, states: ["on", "off"], default: "on", notes: "FSDP2 set_requires_gradient_sync(False) on all but the last micro-batch; HSDP 2x8 over TCP: x2.79 (H20) / x2.70 (H200), +26 GB; DDP no_sync (accelerate accumulate()) is the same idea; measured (diffusion harvest): H100 2n tcp DiT-XL/2 on->off x1.92 (M2DX42T~M2DX40T); H100 2n ib DiT-XL/2 off->on x0.92 (M2DX40~M2DX42); H100 DiT-XL/2 off->on x0.94 (DX40~DX42); H200 DiT-XL/2 off->on x0.95 (HDX40~HDX42); H20 DiT-XL/2 off->on x0.96 (GDX40~GDX42)"}
reshard_after_forward: {class: balance, states: ["on", "off"], default: "on", aliases: {fsdp: [{config: reshard_after_forward, map: {"true": "on", "false": "off"}}]},
                        notes: "FSDP2 off keeps parameters gathered between forward and backward: +2 % (H20) / +4 % (H200), +12.6 GiB at 8B"}
loss_impl:             {class: kernel, states: [hf, chunked, liger], default: hf,
                        notes: "Liger fused linear cross-entropy / chunked CE: a memory knob (-7 GiB at 8B 4k; required at 32k without CP); speed -4 % to +2 %"}
optimizer: {class: kernel, states: [adamw, adamw8bit, adamw_fused], default: adamw, notes: "torchao AdamW8bit: memory knob (-9 GB at 8B, fits 70B on one 8x H200 node with FSDP2 + AC); speed -1 % to 0 %; adamw_fused = torch.optim.AdamW(fused=True); measured (diffusion harvest): H100 DiT-XL/2 adamw->adamw_fused x1.10 (DX06~DX32); H100 sdxl-unet adamw->adamw8bit x0.92 (SX00~SX07); H100 DiT-XL/2 adamw->adamw_fused x1.08 (DX05~DX07); H200 DiT-XL/2 adamw->adamw_fused x1.05 (HDX05~HDX07); H20 sd15-unet adamw->adamw8bit x0.95 (GSA00~GSA06); H100 sd15-unet adamw->adamw8bit x0.95 (SA00~SA06); +2 more", aliases: {accelerate: [{flag: "--use_8bit_adam", present: adamw8bit}]}}
zero_hpz:              {class: balance, states: int, default: "1", aliases: {deepspeed: [{config: zero_optimization.zero_hpz_partition_size, value: state}]},
                        notes: "ZeRO++ secondary partition inside the node; 2 nodes over TCP, ZeRO-3: hpZ 8 x1.76"}
pp_schedule:           {class: balance, states: [1F1B, Interleaved1F1B, ZBVZeroBubble], default: 1F1B,
                        aliases: {torchtitan: [{flag: --parallelism.pipeline-parallel-schedule, value: state}]},
                        notes: "torchtitan PP2 x FSDP4 on one node: ZBVZeroBubble x1.11 over 1F1B (H20 and H200)"}
cp_rotate:             {class: balance, states: [allgather, alltoall], default: allgather,
                        aliases: {torchtitan: [{flag: --parallelism.context-parallel-rotate-method, value: state}]}, notes: "CP8 at 32k: equal"}
moe_float8_grouped_mm: {class: kernel, states: ["off", "on"], default: "off",
                        notes: "torchtitan 0.2.2 / torchao 0.15 prototype float8 grouped GEMM for experts: 0.60x (H20), 0.55x (H200)"}
fsdp_version:          {class: kernel, states: ["1", "2"], default: "1", aliases: {hf_trainer: [{env: FSDP_VERSION, value: state}]},
                        notes: "HF Trainer / accelerate FSDP1 vs FSDP2: within 1.5 %; LitGPT fsdp2 strategy 0.92x of fsdp (H200)"}
qlora: {class: kernel, states: ["off", "on"], default: "off", notes: "bitsandbytes NF4 frozen base weights for LoRA: changes numerics (not a pure speed knob); 0.93x (H20) / 0.84x (H200) of bf16 LoRA; measured (diffusion harvest): H100 qwen-image off->on x0.84 (QL00~QL03)"}

# Merged 2026-10-23 from the diffusion harvest (reports/diffusion_kb_20261022/experience/PROPOSED_MECHANISMS.yaml,
# measured on 8x H100 / H200-class with diffusers 0.41.0, DiffSynth-Studio 2.1.12+, DiT): new mechanisms; the entries
# above that gained diffusion states / accelerate aliases were replaced in place.
